name: Nimbus

on:
  schedule:
    # Run once daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nimbus-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Clone client repo
      run: git clone https://github.com/status-im/nimbus-eth2.git -b unstable

    - name: Delete old test reports
      run: rm -rf docs/reports/nimbus

    - name: Run tests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CONSENSUS_TEST_VECTOR_VERSIONS: nightly
      run: |
        mkdir -p docs/reports/nimbus
        cd nimbus-eth2

        start=$(date +%s.%N)
        if make test > ../docs/reports/nimbus/test.txt 2>&1; then
          echo "TEST_SUCCESS=true" >> "$GITHUB_ENV"
        else
          echo "TEST_SUCCESS=false" >> "$GITHUB_ENV"
        fi
        end=$(date +%s.%N)
        duration=$(echo "$end - $start" | bc)
        echo "TEST_DURATION=${duration}" >> "$GITHUB_ENV"

    - name: Summarize
      run: python3 scripts/make_nimbus_summary.py

    - name: Commit
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git fetch origin

        git add docs/reports/nimbus
        git add docs/summaries/nimbus.json
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "Update nimbus status"
        for i in {1..5}; do
          git pull --rebase origin HEAD && \
          git push && break || {
            echo "Push failed, retrying in 5s..."
            sleep 5
          }
        done