name: Lighthouse

on:
  schedule:
    # Run once daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-lighthouse-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Clone client repo
      run: git clone https://github.com/jtraglia/lighthouse.git -b nightly-tests

    - name: Download tests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CONSENSUS_SPECS_TEST_VERSION: nightly
      run: |
        cd lighthouse
        make make-ef-tests

    - name: Delete old test reports
      run: rm -rf docs/reports/lighthouse

    - name: Run tests
      run: |
        mkdir -p docs/reports/lighthouse
        cd lighthouse

        start=$(date +%s.%N)
        if make run-ef-tests > ../docs/reports/lighthouse/test.txt 2>&1; then
          echo "TEST_SUCCESS=true" >> "$GITHUB_ENV"
        else
          echo "TEST_SUCCESS=false" >> "$GITHUB_ENV"
        fi
        end=$(date +%s.%N)
        duration=$(echo "$end - $start" | bc)
        echo "TEST_DURATION=${duration}" >> "$GITHUB_ENV"

    - name: Summarize
      run: python3 scripts/make_lighthouse_summary.py

    - name: Commit
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git fetch origin

        git add docs/reports/lighthouse
        git add docs/summaries/lighthouse.json
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "Update lighthouse status"
        for i in {1..5}; do
          git pull --rebase origin HEAD && \
          git push && break || {
            echo "Push failed, retrying in 5s..."
            sleep 5
          }
        done
