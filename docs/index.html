<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nightly Client Tests</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 2rem auto 6rem auto;
      padding: 1rem;
      background: #f4f6f8;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      table-layout: auto;
    }

    thead {
      background: #f0f0f0;
    }

    th, td {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid #e5e5e5;
      font-size: 0.95rem;
    }

    th:first-child, td:first-child {
      text-align: left;
      width: 1%;
      white-space: nowrap;
    }

    th:not(:first-child),
    td:not(:first-child) {
      text-align: right;
    }

    th {
      font-weight: 600;
      color: #555;
    }

    td.status {
      font-weight: bold;
      font-size: 1.1rem;
    }

    td.duration {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    td.link a {
      color: #007acc;
      text-decoration: none;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #f4f6f8;
      text-align: center;
      padding: 1rem;
      color: #888;
      font-size: 0.9em;
      line-height: 1.4;
    }
    .github-link {
      margin: 0.25rem 0;
    }
    .github-link a {
      color: #007acc;
      text-decoration: none;
      font-weight: 500;
    }
    .github-icon {
      display: inline-block;
      vertical-align: middle;
      margin-left: 0.25rem;
      width: 16px;
      height: 16px;
      fill: #007acc;
    }
  </style>
</head>
<body>
  <h1>Nightly Client Tests</h1>
  <table>
    <thead>
      <tr>
        <th>Client</th>
        <th>Status</th>
        <th>Duration</th>
        <th>Report</th>
        <th>Updated</th>
      </tr>
    </thead>
    <tbody id="summaries">
      <tr><td colspan="5" style="text-align:center;">Loading…</td></tr>
    </tbody>
  </table>

  <script>
    const CLIENTS = [
      { name: "Grandine" },
      { name: "Lighthouse" },
      { name: "Lodestar" },
      { name: "Prysm" },
      { name: "Nimbus" },
      { name: "Teku", report: "index.html" }
    ];

    function timeAgo(timestamp) {
      const now = new Date();
      const then = new Date(timestamp);
      const diff = Math.floor((now - then) / 60000);
      if (diff < 1) return "just now";
      if (diff === 1) return "1 min ago";
      if (diff < 60) return `${diff} mins ago`;
      const hours = Math.floor(diff / 60);
      if (hours === 1) return "1 hr ago";
      if (hours < 24) return `${hours} hrs ago`;
      const days = Math.floor(hours / 24);
      return days === 1 ? "1 day ago" : `${days} days ago`;
    }

    const tbody = document.getElementById("summaries");
    tbody.innerHTML = "";

    CLIENTS.forEach(({ name, report = "test.txt" }) => {
      const file = name.toLowerCase();
      fetch(`summaries/${file}.json`)
        .then(res => res.json())
        .then(data => {
          const updated = data.timestamp ? timeAgo(data.timestamp) : "";
          const { test_status, test_duration } = data;
          const statusMark = test_status === true ? "✅" : "❌";
          const duration = test_duration || "—";
          const reportLink = `<a href="reports/${file}/${report}" target="_blank">report</a>`;

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${name}</td>
            <td class="status">${statusMark}</td>
            <td class="duration">${duration}</td>
            <td class="link">${reportLink}</td>
            <td>${updated}</td>
          `;
          tbody.appendChild(row);
        })
        .catch(err => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${name}</td>
            <td class="status">⚠️</td>
            <td colspan="3"><pre style="margin:0;">${err.message || err}</pre></td>
          `;
          tbody.appendChild(row);
          console.error(err);
        });
    });
  </script>

  <footer>
    <div class="github-link">
      <a href="https://github.com/jtraglia/nyx" target="_blank">
        Contribute on GitHub
        <svg class="github-icon" viewBox="0 0 16 16" version="1.1" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52
            -.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2
            -3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.01.08-2.11 0 0 .67-.21 2.2.82.64-.18
            1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.91.08 2.11.51.56.82 1.27.82
            2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013
            8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
      </a>
    </div>
    <div><a href="https://en.wikipedia.org/wiki/Nyx" target="_blank">Nyx</a>, the goddess of the night</div>
  </footer>
</body>
</html>
